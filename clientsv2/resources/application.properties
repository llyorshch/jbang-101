spring.application.name=clients
spring.main.banner-mode=off

# No authentication: only listen on the loopback interface.
server.address=127.0.0.1
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

spring.datasource.url=jdbc:h2:file:${CLIENTS_DB:./data/clients}
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.sql.init.mode=always

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Flowable: only the CMMN engine, deployed from classpath:/cases/*.cmmn.xml.
flowable.database-schema-update=true
flowable.cmmn.enabled=true
flowable.cmmn.deploy-resources=true
flowable.cmmn.resource-location=classpath*:/cases/
flowable.cmmn.resource-suffixes=**.cmmn.xml
flowable.cmmn.deployment-name=clients-cases
flowable.idm.enabled=false
flowable.eventregistry.enabled=false
flowable.process.enabled=false
flowable.app.enabled=false
flowable.dmn.enabled=false
flowable.async-executor-activate=false
flowable.cmmn.async-executor-activate=false
flowable.rest-api-enabled=false

logging.level.org.flowable=WARN
